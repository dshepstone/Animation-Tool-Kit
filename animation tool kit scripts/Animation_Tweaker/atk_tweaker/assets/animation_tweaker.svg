  <rect x="2" y="2" width="60" height="60" rx="12" fill="#26323a"/>
  <path d="M8 44 C 20 44, 22 30, 32 30 S 44 44, 56 44" fill="none" stroke="#5b6f78"
        stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M8 44 C 20 44, 22 42, 32 42 S 44 44, 56 44" fill="none" stroke="#6fd3c0"
        stroke-width="4.5" stroke-linecap="round"/>
  <g fill="#e9f2ef">
    <circle cx="8" cy="44" r="3"/><circle cx="20" cy="43.4" r="3"/><circle cx="32" cy="42" r="3"/>
    <circle cx="44" cy="43.4" r="3"/><circle cx="56" cy="44" r="3"/>
  </g>
  <circle cx="32" cy="22" r="8" fill="none" stroke="#f1c56a" stroke-width="3.5"/>
  <path d="M32 31 L 32 37" stroke="#f1c56a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28 34 L 32 38.5 L 36 34" fill="none" stroke="#f1c56a" stroke-width="3.5"
