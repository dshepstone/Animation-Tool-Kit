name: Playblast cross-platform verification
on:
  push:
    branches: [main, 'fix/playblast-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg cache key (Linux, refreshed monthly)
        if: runner.os == 'Linux'
        id: ffmpeg-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore cached FFmpeg (Linux)
        if: runner.os == 'Linux'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-linux64-gpl-${{ steps.ffmpeg-key.outputs.month }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        # The Ubuntu archive mirror has stalled for minutes on FFmpeg's ~100 MB
        # of packages. Use a static build from GitHub's CDN, cached between runs
        # so most runs download nothing. apt only installs the two small GL
        # libraries Qt needs offscreen.
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libegl1 libopengl0
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/ffmpeg.tar.xz"               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p ~/ffmpeg
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C ~/ffmpeg --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install PySide6==6.8.3
      - name: Verify tools are available (do not silently skip integration)
        run: python -c "import shutil; from PySide6 import QtCore; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Toolkit tests (playblast, timeline ticks, toolbar, key tools, registry)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Toolbar layout tests (layout engine, offscreen toolbar and Layout tab; no Maya)
        run: python -m unittest discover -s tests -p "test_toolbar_layout*.py" -v
      - name: Animation Tweaker tests (maths, keying plans, metadata; no Maya)
        run: python -m unittest discover -s tests -p "test_animation_tweaker.py" -v
      - name: Bookmarks tests
        # Run from the tool folder: its tests import "tests.fakes", which
        # would otherwise resolve to the repository's own tests package.
        working-directory: animation tool kit scripts/Bookmarks
        run: |
          python -m pip install pytest pytest-qt
          python -m pytest tests -q -p no:cacheprovider
      - name: Every shipped Python file compiles
        run: python -m compileall -q "animation tool kit scripts" atk_toolbar
      - run: python package_atk_release.py --version 1.1.31
      - name: Upload the test build of the release ZIP
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AnimationToolKit_v1_1_31-test-build
          path: |
            dist/AnimationToolKit_v1_1_31.zip
            dist/AnimationToolKit_v1_1_31.zip.sha256
          if-no-files-found: error
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python package_atk_release.py --version 1.1.31
      - name: Publish verified ATK 1.1.31 release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ATK_1.1.31 >/dev/null 2>&1; then
            echo 'Release already exists; preserving published assets.'
          else
            gh release create ATK_1.1.31 dist/AnimationToolKit_v1_1_31.zip dist/AnimationToolKit_v1_1_31.zip.sha256 --target "$GITHUB_SHA" --title 'Animation Tool Kit v1.1.31' --notes-file Animation_Tool_Kit_v1.1.31_Release_Notes.md --latest
          fi
